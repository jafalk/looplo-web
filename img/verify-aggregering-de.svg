  <rect x="0" y="0" width="880" height="500" rx="6" fill="#FFFFFF" stroke="#D8DEE6"/>
  <text class="t" x="26" y="38">3 · Neutrale Aggregation</text>
  <text class="u" x="26" y="59">Wo die Kette wieder aufgenommen wird, ohne dass eine Partei die Wahrheit allein besitzt</text>
  <line x1="26" y1="74" x2="854" y2="74" stroke="#D8DEE6"/>
  <text class="h" x="26" y="106">EIN</text>
  <rect x="26" y="118" width="190" height="48" rx="5" fill="#FFFFFF" stroke="#D8DEE6"/>
  <rect x="26" y="118" width="3.5" height="48" rx="2" fill="#8C97A6"/>
  <text class="l" x="42" y="138">Agent beim Anbieter</text>
  <text class="s" x="42" y="155">Handlungsprotokoll und Mandat</text>
  <rect x="26" y="178" width="190" height="48" rx="5" fill="#FFFFFF" stroke="#D8DEE6"/>
  <rect x="26" y="178" width="3.5" height="48" rx="2" fill="#8C97A6"/>
  <text class="l" x="42" y="198">Agent beim Kunden</text>
  <text class="s" x="42" y="215">Handlungsprotokoll und Mandat</text>
  <rect x="26" y="238" width="190" height="48" rx="5" fill="#FFFFFF" stroke="#D8DEE6"/>
  <rect x="26" y="238" width="3.5" height="48" rx="2" fill="#8C97A6"/>
  <text class="l" x="42" y="258">Registerdaten</text>
  <text class="s" x="42" y="275">öffentliche Quelle, versioniert</text>
  <rect x="26" y="298" width="190" height="48" rx="5" fill="#FFFFFF" stroke="#D8DEE6"/>
  <rect x="26" y="298" width="3.5" height="48" rx="2" fill="#8C97A6"/>
  <text class="l" x="42" y="318">Stichprobe im Feld</text>
  <text class="s" x="42" y="335">menschliche Kontrolle, selten</text>
  <path d="M216 142 C 262 142, 280 234, 314 234" fill="none" stroke="#D8DEE6" stroke-width="1.5"/>
  <path d="M216 202 C 262 202, 280 234, 314 234" fill="none" stroke="#D8DEE6" stroke-width="1.5"/>
  <path d="M216 262 C 262 262, 280 234, 314 234" fill="none" stroke="#D8DEE6" stroke-width="1.5"/>
  <path d="M216 322 C 262 322, 280 234, 314 234" fill="none" stroke="#D8DEE6" stroke-width="1.5"/>
  <polygon points="320,234 311,229 311,239" fill="#8C97A6"/>
  <rect x="320" y="176" width="200" height="116" rx="6" fill="#FDF8F3" stroke="#C77D3A" stroke-width="1.6"/>
  <text class="h" x="420" y="202" text-anchor="middle" fill="#A5652C">DIE AGGREGATION</text>
  <text class="l" x="420" y="230" text-anchor="middle">Looplo Verify</text>
  <text class="s" x="420" y="252" text-anchor="middle">gehört keinem</text>
  <text class="s" x="420" y="270" text-anchor="middle">der Parteien</text>
  <path d="M520 234 C 550 234, 560 160, 594 160" fill="none" stroke="#D8DEE6" stroke-width="1.5"/>
  <rect x="600" y="134" width="254" height="54" rx="5" fill="#FFFFFF" stroke="#D8DEE6"/>
  <rect x="600" y="134" width="3.5" height="54" rx="2" fill="#2F6B4F"/>
  <text class="l" x="616" y="156">Attestierte Behauptung</text>
  <text class="s" x="616" y="174">was nach außen gesagt werden darf</text>
  <path d="M520 234 C 550 234, 560 232, 594 232" fill="none" stroke="#D8DEE6" stroke-width="1.5"/>
  <rect x="600" y="206" width="254" height="54" rx="5" fill="#FFFFFF" stroke="#D8DEE6"/>
  <rect x="600" y="206" width="3.5" height="54" rx="2" fill="#2F6B4F"/>
  <text class="l" x="616" y="228">Die Provenienzkette</text>
  <text class="s" x="616" y="246">Mandat, Modell, Grundlage, Handlung</text>
  <path d="M520 234 C 550 234, 560 304, 594 304" fill="none" stroke="#D8DEE6" stroke-width="1.5"/>
  <rect x="600" y="278" width="254" height="54" rx="5" fill="#FFFFFF" stroke="#D8DEE6"/>
  <rect x="600" y="278" width="3.5" height="54" rx="2" fill="#2F6B4F"/>
  <text class="l" x="616" y="300">Der Vorbehalt</text>
  <text class="s" x="616" y="318">was der Beweis nicht abdeckt</text>
  <text class="h" x="600" y="106">RAUS, AN DEN MARKT</text>
  <rect x="26" y="368" width="828" height="46" rx="5" fill="#F4F6F8" stroke="#D8DEE6" stroke-dasharray="5 4"/>
  <text class="h" x="42" y="388">VERLÄSST NIE DIE EINZELNE PARTEI</text>
  <text class="b" x="42" y="406">Roh-Logdaten · Kundennamen · Preisgestaltung · Quellcode · alles, worum sie konkurrieren</text>
  <text class="b" x="26" y="440">Wo die Ebene läuft und wer die Schlüssel hält, entscheidet, wer sie schließen kann. Das ist eine Wahl, keine Formsache.</text>
  <line x1="26" y1="454" x2="854" y2="454" stroke="#D8DEE6"/>
  <text class="f" x="26" y="474">Vier Quellen liefern ein. Keine von ihnen kann die Grundlage der anderen lesen.</text>
  <text class="fk" x="854" y="474" text-anchor="end">Wer kann die Ebene abschalten</text>
</svg>