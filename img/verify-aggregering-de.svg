<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 500" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-labelledby="vfnT vfnD" class="vfn">
  <title id="vfnT">Neutrale Aggregation</title>
  <desc id="vfnD">Wo die Kette wieder aufgenommen wird, ohne dass eine Partei die Wahrheit allein besitzt</desc>
  <style>
    .vfn .t{font-family:Arial,sans-serif;font-size:19px;font-weight:700;fill:#141C2B}
    .vfn .u{font-family:Arial,sans-serif;font-size:12.5px;fill:#6B7685}
