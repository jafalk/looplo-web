  <text class="b" x="652" y="454">ganger sagt nei</text>
  <text class="b" x="26" y="500">En peer som aldri har sagt nei, er ikke et review. Tallet er en del av profilen, ikke en note i en mappe.</text>
  <line x1="26" y1="502" x2="854" y2="502" stroke="#D8DEE6"/>
  <text class="f" x="26" y="522">Grunnlag, rekkevidde og habilitet står samlet. Ellers er uavhengighet en påstand.</text>
