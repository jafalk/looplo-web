  <text class="b" x="42" y="472">Die interessante Zahl sind nicht die 3.940 attestierten. Es sind die 199, die ohne ihre Grundlage hinausgingen.</text>
  <line x1="26" y1="500" x2="854" y2="500" stroke="#D8DEE6"/>
