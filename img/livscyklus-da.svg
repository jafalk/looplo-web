<svg viewBox="0 0 1284 811.6" width="1284" height="811.6" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-labelledby="lmT lmD" class="livsmatrix">
  <title id="lmT">Livscyklus krydset med aftryk</title>
  <desc id="lmD">Otte livscyklustrin gange fem slags aftryk giver fyrre felter med hver sin beskrivelse.
  Kun priskolonnen er opgjort i praksis, og kun for de trin der står på en faktura. Drivhusgas er delvist
  dækket samme steder. Vand, radioaktivitet og FN Verdensmål har ingen felter overhovedet.</desc>
  <style>
    .livsmatrix .mh{font-family:"Archivo",Arial,sans-serif;font-size:13px;font-weight:700;fill:#FFFFFF}
    .livsmatrix .mhe{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;fill:#C3CCD8}
    .livsmatrix .mt{font-family:"Archivo",Arial,sans-serif;font-size:14px;font-weight:700;fill:#141C2B}
    .livsmatrix .mu{font-family:"Archivo",Arial,sans-serif;font-size:11px;fill:#6B7685}
    .livsmatrix .mc{font-family:"Archivo",Arial,sans-serif;font-size:11.6px;fill:#46505E}
    .livsmatrix .mcm{font-family:"Archivo",Arial,sans-serif;font-size:11.6px;fill:#8B96A3}
    .livsmatrix .mf{font-family:"Archivo",Arial,sans-serif;font-size:11.5px;fill:#6B7685}
    .livsmatrix .mfb{font-family:"Archivo",Arial,sans-serif;font-size:11.5px;font-weight:700;fill:#A5652C}
  </style>
  <rect x="0" y="0" width="1284.0" height="811.6" fill="#FFFFFF"/>
  <a href="index.html#groent">
    <rect x="0" y="0" width="1284.0" height="44" fill="#141C2B"/>
    <text x="16" y="28" font-family="Archivo,Arial,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">&#8592; Tilbage til Gr&#248;nt regnskab</text>
    <text x="1268.0" y="28" text-anchor="end" font-family="Archivo,Arial,sans-serif" font-size="13" fill="#C3CCD8">Knib for at zoome</text>
  </a>
  <g transform="translate(0,44)">
  <rect x="0" y="0" width="1284" height="767.6" fill="#FFFFFF"/>
  <rect x="0" y="0" width="214" height="62" fill="#141C2B"/>
  <text class="mh" x="16" y="26">Livscyklustrin</text>
  <text class="mhe" x="16" y="45">otte trin i to spor</text>
  <rect x="214" y="0" width="214" height="62" fill="#141C2B"/>
  <text class="mh" x="227" y="26">Pris</text>
  <text class="mhe" x="227" y="45">kr</text>
  <rect x="428" y="0" width="214" height="62" fill="#141C2B"/>
  <text class="mh" x="441" y="26">Drivhusgas</text>
  <text class="mhe" x="441" y="45">CO2e</text>
  <rect x="642" y="0" width="214" height="62" fill="#A5652C"/>
  <text class="mh" x="655" y="26">Vand</text>
  <text class="mhe" x="655" y="45">m3</text>
  <rect x="856" y="0" width="214" height="62" fill="#A5652C"/>
  <text class="mh" x="869" y="26">Radioaktivitet</text>
  <text class="mhe" x="869" y="45">restmateriale</text>
  <rect x="1070" y="0" width="214" height="62" fill="#A5652C"/>
  <text class="mh" x="1083" y="26">FN Verdensmål</text>
  <text class="mhe" x="1083" y="45">ESG</text>
  <rect x="0" y="62" width="1284" height="91.6" fill="#F7F9FB"/>
  <rect x="0" y="62" width="4" height="91.6" fill="#2F6B4F"/>
  <line x1="0" y1="62" x2="1284" y2="62" stroke="#D8DEE6"/>
  <text class="mt" x="16" y="88">Anskaffelse</text>
  <text class="mu" x="16" y="106">Det I køber og ejer selv</text>
  <line x1="214" y1="62" x2="214" y2="153.6" stroke="#D8DEE6"/>
  <rect x="215" y="63" width="212" height="89.6" fill="#141C2B" fill-opacity=".025"/>
  <rect x="215" y="63" width="3.5" height="89.6" fill="#9AA8B6"/>
  <text class="mc" x="227" y="86.0">Capex, afskrivning og restværdi</text>
  <line x1="428" y1="62" x2="428" y2="153.6" stroke="#D8DEE6"/>
  <text class="mcm" x="441" y="86.0">Indlejret udledning fra</text>
  <text class="mcm" x="441" y="101.4">produktion og transport - falder</text>
  <text class="mcm" x="441" y="116.8">på købsåret, ikke på driften</text>
  <line x1="642" y1="62" x2="642" y2="153.6" stroke="#D8DEE6"/>
  <text class="mcm" x="655" y="86.0">Chipfremstilling er vandtungt.</text>
  <text class="mcm" x="655" y="101.4">Ofte det største enkeltbidrag,</text>
  <text class="mcm" x="655" y="116.8">og næsten aldrig opgjort</text>
  <line x1="856" y1="62" x2="856" y2="153.6" stroke="#D8DEE6"/>
  <text class="mcm" x="869" y="86.0">Mineudvinding af sjældne</text>
  <text class="mcm" x="869" y="101.4">jordarter efterlader radioaktivt</text>
  <text class="mcm" x="869" y="116.8">restmateriale</text>
  <line x1="1070" y1="62" x2="1070" y2="153.6" stroke="#D8DEE6"/>
  <text class="mcm" x="1083" y="86.0">Arbejdsforhold i</text>
  <text class="mcm" x="1083" y="101.4">leverandørkæden,</text>
  <text class="mcm" x="1083" y="116.8">konfliktmineraler, levetid og</text>
  <text class="mcm" x="1083" y="132.2">reparerbarhed</text>
  <rect x="0" y="153.6" width="1284" height="91.6" fill="#FFFFFF"/>
  <rect x="0" y="153.6" width="4" height="91.6" fill="#2F6B4F"/>
  <line x1="0" y1="153.6" x2="1284" y2="153.6" stroke="#D8DEE6"/>
  <text class="mt" x="16" y="179.6">Leje</text>
  <text class="mu" x="16" y="197.6">Det I betaler for at bruge</text>
  <line x1="214" y1="153.6" x2="214" y2="245.2" stroke="#D8DEE6"/>
  <rect x="215" y="154.6" width="212" height="89.6" fill="#141C2B" fill-opacity=".055"/>
  <rect x="215" y="154.6" width="3.5" height="89.6" fill="#141C2B"/>
  <text class="mc" x="227" y="177.6">Løbende leje, bindingsperiode og</text>
  <text class="mc" x="227" y="193.0">exitomkostning</text>
  <line x1="428" y1="153.6" x2="428" y2="245.2" stroke="#D8DEE6"/>
  <rect x="429" y="154.6" width="212" height="89.6" fill="#141C2B" fill-opacity=".025"/>
  <rect x="429" y="154.6" width="3.5" height="89.6" fill="#9AA8B6"/>
  <text class="mc" x="441" y="177.6">Leverandørens faktor, ikke jeres</text>
  <text class="mc" x="441" y="193.0">egen. I arver deres valg af</text>
  <text class="mc" x="441" y="208.4">elmiks</text>
  <line x1="642" y1="153.6" x2="642" y2="245.2" stroke="#D8DEE6"/>
  <text class="mcm" x="655" y="177.6">Køling i leverandørens</text>
  <text class="mcm" x="655" y="193.0">datacenter. Sjældent oplyst pr.</text>
  <text class="mcm" x="655" y="208.4">kunde</text>
  <line x1="856" y1="153.6" x2="856" y2="245.2" stroke="#D8DEE6"/>
  <text class="mcm" x="869" y="177.6">Afhænger af leverandørens elmiks</text>
  <text class="mcm" x="869" y="193.0">og dermed af andelen af</text>
  <text class="mcm" x="869" y="208.4">kernekraft</text>
  <line x1="1070" y1="153.6" x2="1070" y2="245.2" stroke="#D8DEE6"/>
  <text class="mcm" x="1083" y="177.6">Hvor meget I overhovedet kan få</text>
  <text class="mcm" x="1083" y="193.0">oplyst, er en</text>
  <text class="mcm" x="1083" y="208.4">kontraktforhandling - ikke en</text>
  <text class="mcm" x="1083" y="223.8">måling</text>
  <rect x="0" y="245.2" width="1284" height="76.2" fill="#F7F9FB"/>
  <rect x="0" y="245.2" width="4" height="76.2" fill="#2F6B4F"/>
  <line x1="0" y1="245.2" x2="1284" y2="245.2" stroke="#D8DEE6"/>
  <text class="mt" x="16" y="271.2">Drift og forbrug</text>
  <text class="mu" x="16" y="289.2">Det der løber hver måned</text>
  <line x1="214" y1="245.2" x2="214" y2="321.4" stroke="#D8DEE6"/>
  <rect x="215" y="246.2" width="212" height="74.2" fill="#141C2B" fill-opacity=".055"/>
  <rect x="215" y="246.2" width="3.5" height="74.2" fill="#141C2B"/>
  <text class="mc" x="227" y="269.2">Den ene post FinOps allerede</text>
  <text class="mc" x="227" y="284.59999999999997">måler godt</text>
  <line x1="428" y1="245.2" x2="428" y2="321.4" stroke="#D8DEE6"/>
  <rect x="429" y="246.2" width="212" height="74.2" fill="#141C2B" fill-opacity=".025"/>
  <rect x="429" y="246.2" width="3.5" height="74.2" fill="#9AA8B6"/>
  <text class="mc" x="441" y="269.2">Elforbrug gange en faktor der</text>
  <text class="mc" x="441" y="284.59999999999997">varierer med tid og sted</text>
  <line x1="642" y1="245.2" x2="642" y2="321.4" stroke="#D8DEE6"/>
  <text class="mcm" x="655" y="269.2">Køling. Stiger med udetemperatur</text>
  <text class="mcm" x="655" y="284.59999999999997">og med belastningsgrad</text>
  <line x1="856" y1="245.2" x2="856" y2="321.4" stroke="#D8DEE6"/>
  <text class="mcm" x="869" y="269.2">Bestemmes af elmikset i den</text>
  <text class="mcm" x="869" y="284.59999999999997">region I har valgt at køre i</text>
  <line x1="1070" y1="245.2" x2="1070" y2="321.4" stroke="#D8DEE6"/>
  <text class="mcm" x="1083" y="269.2">Varmegenanvendelse,</text>
  <text class="mcm" x="1083" y="284.59999999999997">arealanvendelse, støj og lokal</text>
  <text class="mcm" x="1083" y="300.0">netbelastning</text>
  <rect x="0" y="321.4" width="1284" height="76.2" fill="#FFFFFF"/>
  <rect x="0" y="321.4" width="4" height="76.2" fill="#2F6B4F"/>
  <line x1="0" y1="321.4" x2="1284" y2="321.4" stroke="#D8DEE6"/>
  <text class="mt" x="16" y="347.4">Afvikling</text>
  <text class="mu" x="16" y="365.4">Det der sker til sidst</text>
  <line x1="214" y1="321.4" x2="214" y2="397.59999999999997" stroke="#D8DEE6"/>
  <text class="mcm" x="227" y="345.4">Nedtagning, dokumenteret</text>
  <text class="mcm" x="227" y="360.79999999999995">datasletning, eventuel restværdi</text>
  <line x1="428" y1="321.4" x2="428" y2="397.59999999999997" stroke="#D8DEE6"/>
  <text class="mcm" x="441" y="345.4">Transport og genanvendelse.</text>
  <text class="mcm" x="441" y="360.79999999999995">Lille post, men den lukker</text>
  <text class="mcm" x="441" y="376.2">regnestykket</text>
  <line x1="642" y1="321.4" x2="642" y2="397.59999999999997" stroke="#D8DEE6"/>
  <text class="mcm" x="655" y="345.4">Begrænset ved afvikling</text>
  <line x1="856" y1="321.4" x2="856" y2="397.59999999999997" stroke="#D8DEE6"/>
  <text class="mcm" x="869" y="345.4">Deponi af komponenter med</text>
  <text class="mcm" x="869" y="360.79999999999995">sjældne jordarter</text>
  <line x1="1070" y1="321.4" x2="1070" y2="397.59999999999997" stroke="#D8DEE6"/>
  <text class="mcm" x="1083" y="345.4">Genbrug frem for skrot. Bevis</text>
  <text class="mcm" x="1083" y="360.79999999999995">for sletning frem for erklæring</text>
  <text class="mcm" x="1083" y="376.2">om sletning</text>
  <rect x="0" y="397.59999999999997" width="1284" height="76.2" fill="#F7F9FB"/>
  <rect x="0" y="397.59999999999997" width="4" height="76.2" fill="#2F6B4F"/>
  <line x1="0" y1="397.59999999999997" x2="1284" y2="397.59999999999997" stroke="#D8DEE6"/>
  <text class="mt" x="16" y="423.59999999999997">Udvikling</text>
  <text class="mu" x="16" y="441.59999999999997">Før modellen findes</text>
  <line x1="214" y1="397.59999999999997" x2="214" y2="473.79999999999995" stroke="#D8DEE6"/>
  <text class="mcm" x="227" y="421.59999999999997">Mennesketid. Den største post,</text>
  <text class="mcm" x="227" y="436.99999999999994">og den der mindst bliver målt</text>
  <line x1="428" y1="397.59999999999997" x2="428" y2="473.79999999999995" stroke="#D8DEE6"/>
  <text class="mcm" x="441" y="421.59999999999997">Eksperimenter og fejlslagne</text>
  <text class="mcm" x="441" y="436.99999999999994">forsøg. Tælles næsten aldrig med</text>
  <line x1="642" y1="397.59999999999997" x2="642" y2="473.79999999999995" stroke="#D8DEE6"/>
  <text class="mcm" x="655" y="421.59999999999997">Som drift, men i korte</text>
  <text class="mcm" x="655" y="436.99999999999994">spidsbelastninger</text>
  <line x1="856" y1="397.59999999999997" x2="856" y2="473.79999999999995" stroke="#D8DEE6"/>
  <text class="mcm" x="869" y="421.59999999999997">Som drift. Følger regionsvalget</text>
  <line x1="1070" y1="397.59999999999997" x2="1070" y2="473.79999999999995" stroke="#D8DEE6"/>
  <text class="mcm" x="1083" y="421.59999999999997">Datagrundlagets herkomst og</text>
  <text class="mcm" x="1083" y="436.99999999999994">hjemmel. Afgøres her eller</text>
  <text class="mcm" x="1083" y="452.4">aldrig</text>
  <rect x="0" y="473.79999999999995" width="1284" height="91.6" fill="#FFFFFF"/>
  <rect x="0" y="473.79999999999995" width="4" height="91.6" fill="#2F6B4F"/>
  <line x1="0" y1="473.79999999999995" x2="1284" y2="473.79999999999995" stroke="#D8DEE6"/>
  <text class="mt" x="16" y="499.79999999999995">Træning</text>
  <text class="mu" x="16" y="517.8">Når modellen bliver til</text>
  <line x1="214" y1="473.79999999999995" x2="214" y2="565.4" stroke="#D8DEE6"/>
  <rect x="215" y="474.79999999999995" width="212" height="89.6" fill="#141C2B" fill-opacity=".055"/>
  <rect x="215" y="474.79999999999995" width="3.5" height="89.6" fill="#141C2B"/>
  <text class="mc" x="227" y="497.79999999999995">Et engangsbeløb, og ofte det</text>
  <text class="mc" x="227" y="513.1999999999999">eneste tal nogen nævner</text>
  <line x1="428" y1="473.79999999999995" x2="428" y2="565.4" stroke="#D8DEE6"/>
  <rect x="429" y="474.79999999999995" width="212" height="89.6" fill="#141C2B" fill-opacity=".025"/>
  <rect x="429" y="474.79999999999995" width="3.5" height="89.6" fill="#9AA8B6"/>
  <text class="mc" x="441" y="497.79999999999995">Koncentreret i tid og dermed let</text>
  <text class="mc" x="441" y="513.1999999999999">at opgøre. Bliver alligevel</text>
  <text class="mc" x="441" y="528.5999999999999">sjældent gjort</text>
  <line x1="642" y1="473.79999999999995" x2="642" y2="565.4" stroke="#D8DEE6"/>
  <text class="mcm" x="655" y="497.79999999999995">Køling under vedvarende fuld</text>
  <text class="mcm" x="655" y="513.1999999999999">last. Højeste vandintensitet i</text>
  <text class="mcm" x="655" y="528.5999999999999">hele kæden</text>
  <line x1="856" y1="473.79999999999995" x2="856" y2="565.4" stroke="#D8DEE6"/>
  <text class="mcm" x="869" y="497.79999999999995">Regionsvalget afgør det. En</text>
  <text class="mcm" x="869" y="513.1999999999999">beslutning der tages på en</text>
  <text class="mcm" x="869" y="528.5999999999999">eftermiddag</text>
  <line x1="1070" y1="473.79999999999995" x2="1070" y2="565.4" stroke="#D8DEE6"/>
  <text class="mcm" x="1083" y="497.79999999999995">Kan en eksisterende model</text>
  <text class="mcm" x="1083" y="513.1999999999999">genbruges. Det billigste</text>
  <text class="mcm" x="1083" y="528.5999999999999">træningspas er det der ikke</text>
  <text class="mcm" x="1083" y="544.0">køres</text>
  <rect x="0" y="565.4" width="1284" height="74" fill="#F7F9FB"/>
  <rect x="0" y="565.4" width="4" height="74" fill="#2F6B4F"/>
  <line x1="0" y1="565.4" x2="1284" y2="565.4" stroke="#D8DEE6"/>
  <text class="mt" x="16" y="591.4">Anvendelse</text>
  <text class="mu" x="16" y="609.4">Forbrug pr. forespørgsel,</text>
  <text class="mu" x="16" y="623.4">målt i flop eller token</text>
  <line x1="214" y1="565.4" x2="214" y2="639.4" stroke="#D8DEE6"/>
  <rect x="215" y="566.4" width="212" height="72" fill="#141C2B" fill-opacity=".055"/>
  <rect x="215" y="566.4" width="3.5" height="72" fill="#141C2B"/>
  <text class="mc" x="227" y="589.4">Pr. token. Den post der vokser</text>
  <text class="mc" x="227" y="604.8">uden at nogen har besluttet det</text>
  <line x1="428" y1="565.4" x2="428" y2="639.4" stroke="#D8DEE6"/>
  <rect x="429" y="566.4" width="212" height="72" fill="#141C2B" fill-opacity=".025"/>
  <rect x="429" y="566.4" width="3.5" height="72" fill="#9AA8B6"/>
  <text class="mc" x="441" y="589.4">Pr. forespørgsel, ganget med et</text>
  <text class="mc" x="441" y="604.8">antal ingen forudsagde</text>
  <line x1="642" y1="565.4" x2="642" y2="639.4" stroke="#D8DEE6"/>
  <text class="mcm" x="655" y="589.4">Pr. forespørgsel. Lille tal,</text>
  <text class="mcm" x="655" y="604.8">stort produkt</text>
  <line x1="856" y1="565.4" x2="856" y2="639.4" stroke="#D8DEE6"/>
  <text class="mcm" x="869" y="589.4">Pr. forespørgsel. Følger</text>
  <text class="mcm" x="869" y="604.8">regionen, ikke modellen</text>
  <line x1="1070" y1="565.4" x2="1070" y2="639.4" stroke="#D8DEE6"/>
  <text class="mcm" x="1083" y="589.4">Modelvalg. En mindre model giver</text>
  <text class="mcm" x="1083" y="604.8">ofte samme svar til en brøkdel</text>
  <rect x="0" y="639.4" width="1284" height="76.2" fill="#FFFFFF"/>
  <rect x="0" y="639.4" width="4" height="76.2" fill="#2F6B4F"/>
  <line x1="0" y1="639.4" x2="1284" y2="639.4" stroke="#D8DEE6"/>
  <text class="mt" x="16" y="665.4">Exit</text>
  <text class="mu" x="16" y="683.4">Når I skal videre</text>
  <line x1="214" y1="639.4" x2="214" y2="715.6" stroke="#D8DEE6"/>
  <text class="mcm" x="227" y="663.4">Udtræk, omskrivning og</text>
  <text class="mcm" x="227" y="678.8">dobbeltdrift i overgangen</text>
  <line x1="428" y1="639.4" x2="428" y2="715.6" stroke="#D8DEE6"/>
  <text class="mcm" x="441" y="663.4">Parallel drift koster dobbelt så</text>
  <text class="mcm" x="441" y="678.8">længe den varer</text>
  <line x1="642" y1="639.4" x2="642" y2="715.6" stroke="#D8DEE6"/>
  <text class="mcm" x="655" y="663.4">Som drift, i den periode begge</text>
  <text class="mcm" x="655" y="678.8">kører</text>
  <line x1="856" y1="639.4" x2="856" y2="715.6" stroke="#D8DEE6"/>
  <text class="mcm" x="869" y="663.4">Som drift</text>
  <line x1="1070" y1="639.4" x2="1070" y2="715.6" stroke="#D8DEE6"/>
  <text class="mcm" x="1083" y="663.4">Kan modellen og begreberne</text>
  <text class="mcm" x="1083" y="678.8">overhovedet flyttes. Det afgøres</text>
  <text class="mcm" x="1083" y="694.1999999999999">ved anskaffelsen, ikke ved exit</text>
  <line x1="0" y1="715.6" x2="1284" y2="715.6" stroke="#D8DEE6"/>
  <rect x="16" y="731.6" width="14" height="11" fill="#141C2B" fill-opacity=".055"/>
  <rect x="16" y="731.6" width="3.5" height="11" fill="#141C2B"/>
  <text class="mf" x="37" y="741.6">opgjort i praksis</text>
  <rect x="165" y="731.6" width="14" height="11" fill="#141C2B" fill-opacity=".025"/>
  <rect x="165" y="731.6" width="3.5" height="11" fill="#9AA8B6"/>
  <text class="mf" x="186" y="741.6">delvist</text>
