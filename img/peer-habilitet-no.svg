  <line x1="26" y1="410" x2="854" y2="410" stroke="#D8DEE6"/>
  <text class="b" x="26" y="432">Også Looplos eget EA-spor er inhabilt her. Det er poenget: habilitet følger rollen i saken, ikke navnet på huset.</text>
  <line x1="26" y1="440" x2="854" y2="440" stroke="#D8DEE6"/>
  <text class="f" x="26" y="460">Avstand: antall ledd til nærmeste felles eier, kontrakt eller ledelseslinje.</text>
