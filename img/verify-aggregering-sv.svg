  <rect x="0" y="0" width="880" height="500" rx="6" fill="#FFFFFF" stroke="#D8DEE6"/>
  <text class="t" x="26" y="38">3 · Neutral aggregering</text>
  <text class="u" x="26" y="59">Var kedjan samlas upp igen, utan att någon part äger sanningen ensam</text>
  <line x1="26" y1="74" x2="854" y2="74" stroke="#D8DEE6"/>
  <text class="h" x="26" y="106">IN</text>
