  <text class="h" x="420" y="202" text-anchor="middle" fill="#A5652C">AGGREGERINGEN</text>
  <text class="l" x="420" y="230" text-anchor="middle">Looplo Verify</text>
  <text class="s" x="420" y="252" text-anchor="middle">ägs av ingen</text>
  <text class="s" x="420" y="270" text-anchor="middle">av parterna</text>
  <path d="M520 234 C 550 234, 560 160, 594 160" fill="none" stroke="#D8DEE6" stroke-width="1.5"/>
  <rect x="600" y="134" width="254" height="54" rx="5" fill="#FFFFFF" stroke="#D8DEE6"/>
  <rect x="600" y="134" width="3.5" height="54" rx="2" fill="#2F6B4F"/>
  <text class="l" x="616" y="156">Attesterat påstående</text>
  <text class="s" x="616" y="174">vad som får sägas utåt</text>
  <path d="M520 234 C 550 234, 560 232, 594 232" fill="none" stroke="#D8DEE6" stroke-width="1.5"/>
  <rect x="600" y="206" width="254" height="54" rx="5" fill="#FFFFFF" stroke="#D8DEE6"/>
  <rect x="600" y="206" width="3.5" height="54" rx="2" fill="#2F6B4F"/>
  <text class="l" x="616" y="228">Provenienskedjan</text>
  <text class="s" x="616" y="246">mandat, modell, grund, handling</text>
  <path d="M520 234 C 550 234, 560 304, 594 304" fill="none" stroke="#D8DEE6" stroke-width="1.5"/>
  <rect x="600" y="278" width="254" height="54" rx="5" fill="#FFFFFF" stroke="#D8DEE6"/>
  <rect x="600" y="278" width="3.5" height="54" rx="2" fill="#2F6B4F"/>
  <text class="l" x="616" y="300">Förbehållet</text>
  <text class="s" x="616" y="318">vad beviset inte täcker</text>
  <text class="h" x="600" y="106">UT, TILL MARKNADEN</text>
  <rect x="26" y="368" width="828" height="46" rx="5" fill="#F4F6F8" stroke="#D8DEE6" stroke-dasharray="5 4"/>
  <text class="h" x="42" y="388">LÄMNAR ALDRIG DEN ENSKILDA PARTEN</text>
  <text class="b" x="42" y="406">rå loggdata · kundnamn · prissättning · källkod · allt det de konkurrerar om</text>
  <text class="b" x="26" y="440">Var lagret körs, och vem som håller nycklarna, avgör vem som kan stänga det. Det är ett val, inte en teknikalitet.</text>
  <line x1="26" y1="454" x2="854" y2="454" stroke="#D8DEE6"/>
  <text class="f" x="26" y="474">Fyra källor levererar in. Ingen av dem kan läsa varandras grund.</text>
  <text class="fk" x="854" y="474" text-anchor="end">Vem kan stänga av lagret</text>
</svg>