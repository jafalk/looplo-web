<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 450" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-labelledby="pdaT pdaD" class="pda">
  <title id="pdaT">Die Abdeckung</title>
  <desc id="pdaD">Was passiert, wenn die Fachperson in der einen Domäne nicht verfügbar ist</desc>
  <style>
    .pda .t{font-family:Arial,sans-serif;font-size:19px;font-weight:700;fill:#141C2B}
    .pda .u{font-family:Arial,sans-serif;font-size:12.5px;fill:#6B7685}
    .pda .h{font-family:Arial,sans-serif;font-size:12px;font-weight:700;fill:#6B7685;letter-spacing:.07em}
    .pda .l{font-family:Arial,sans-serif;font-size:13.5px;font-weight:700;fill:#141C2B}
    .pda .b{font-family:Arial,sans-serif;font-size:12.5px;fill:#46505E}
    .pda .s{font-family:Arial,sans-serif;font-size:11.5px;fill:#6B7685}
    .pda .n{font-family:ui-monospace,Menlo,monospace;font-size:13px;fill:#141C2B}
    .pda .nb{font-family:ui-monospace,Menlo,monospace;font-size:16px;font-weight:700;fill:#141C2B}
    .pda .k{font-family:ui-monospace,Menlo,monospace;font-size:11px;fill:#6B7685}
    .pda .f{font-family:Arial,sans-serif;font-size:11.5px;fill:#6B7685}
    .pda .fk{font-family:Arial,sans-serif;font-size:11.5px;font-weight:700;fill:#A5652C}
  </style>
  <rect x="0" y="0" width="880" height="450" rx="6" fill="#FFFFFF" stroke="#D8DEE6"/>
  <text class="t" x="26" y="38">4 · Die Abdeckung</text>
  <text class="u" x="26" y="59">Was passiert, wenn die Fachperson in der einen Domäne nicht verfügbar ist</text>
  <line x1="26" y1="74" x2="854" y2="74" stroke="#D8DEE6"/>
  <rect x="26" y="104" width="262" height="80" rx="6" fill="#FFFFFF" stroke="#D8DEE6"/>
  <rect x="26" y="104" width="3.5" height="80" rx="2" fill="#2F6B4F"/>
  <text class="l" x="42" y="130" fill="#141C2B">EA · Enterprise-Architektur</text>
  <text class="s" x="42" y="150">deckt HYPER und SEC ab</text>
  <circle cx="264" cy="126" r="5" fill="#2F6B4F"/>
  <text class="k" x="42" y="170" fill="#2F6B4F">verfügbar für Prüfung</text>
  <rect x="306" y="104" width="262" height="80" rx="6" fill="#FFFFFF" stroke="#D8DEE6"/>
  <rect x="306" y="104" width="3.5" height="80" rx="2" fill="#2F6B4F"/>
  <text class="l" x="322" y="130" fill="#141C2B">HYPER · Hyperscale Cloud</text>
  <text class="s" x="322" y="150">deckt SEC und AI ab</text>
  <circle cx="544" cy="126" r="5" fill="#2F6B4F"/>
  <text class="k" x="322" y="170" fill="#2F6B4F">verfügbar für Prüfung</text>
  <rect x="586" y="104" width="262" height="80" rx="6" fill="#F4F6F8" stroke="#D8DEE6"/>
  <rect x="586" y="104" width="3.5" height="80" rx="2" fill="#B0413E"/>
  <text class="l" x="602" y="130" fill="#6B7685">SEC · Zero Trust</text>
  <text class="s" x="602" y="150">nicht verfügbar Woche 34</text>
  <circle cx="824" cy="126" r="5" fill="#B0413E"/>
  <text class="k" x="602" y="170" fill="#B0413E">abgedeckt durch EA und HYPER</text>
  <rect x="26" y="202" width="262" height="80" rx="6" fill="#FFFFFF" stroke="#D8DEE6"/>
  <rect x="26" y="202" width="3.5" height="80" rx="2" fill="#2F6B4F"/>
  <text class="l" x="42" y="228" fill="#141C2B">AI · AI-Fähigkeit</text>
  <text class="s" x="42" y="248">deckt EQ und EA ab</text>
  <circle cx="264" cy="224" r="5" fill="#2F6B4F"/>
  <text class="k" x="42" y="268" fill="#2F6B4F">verfügbar für Prüfung</text>
  <rect x="306" y="202" width="262" height="80" rx="6" fill="#FFFFFF" stroke="#D8DEE6"/>
  <rect x="306" y="202" width="3.5" height="80" rx="2" fill="#2F6B4F"/>
  <text class="l" x="322" y="228" fill="#141C2B">EQ · Psychologische Sicherheit</text>
  <text class="s" x="322" y="248">deckt EA und HYPER ab</text>
  <circle cx="544" cy="224" r="5" fill="#2F6B4F"/>
  <text class="k" x="322" y="268" fill="#2F6B4F">verfügbar für Prüfung</text>
  <text class="h" x="26" y="318">PRÜFKAPAZITÄT IN WOCHE 34</text>
  <rect x="26" y="332" width="828" height="16" rx="8" fill="#F4F6F8" stroke="#D8DEE6"/>
  <rect x="26" y="332" width="662" height="16" rx="8" fill="#2F6B4F" fill-opacity=".55"/>
  <line x1="357" y1="326" x2="357" y2="356" stroke="#C77D3A" stroke-width="2"/>
  <text class="k" x="365" y="368" fill="#A5652C">die Anforderung: zwei unbefangene Prüfungen</text>
  <text class="k" x="854" y="368" text-anchor="end">vier von fünf Domänen verfügbar</text>
  <text class="b" x="26" y="398">Eine Domäne fiel weg. Die Entscheidung kann noch von zweien geprüft werden, die sie nicht gebaut haben.</text>
  <line x1="26" y1="404" x2="854" y2="404" stroke="#D8DEE6"/>
  <text class="f" x="26" y="424">Keine einzelne Fachperson ist notwendig. Das ist der ganze Sinn davon, niemanden in der Mitte zu haben.</text>
  <text class="fk" x="854" y="424" text-anchor="end">Backup ist eingebaut</text>
</svg>