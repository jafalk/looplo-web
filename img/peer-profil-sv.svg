  </style>
  <rect x="0" y="0" width="880" height="548" rx="6" fill="#FFFFFF" stroke="#D8DEE6"/>
  <text class="t" x="26" y="38">5 · Peer-profilen</text>
  <text class="u" x="26" y="59">Vad som ska stå om en expert, innan någon kan använda deras nej till något</text>
  <line x1="26" y1="74" x2="854" y2="74" stroke="#D8DEE6"/>
  <rect x="26" y="92" width="828" height="86" rx="6" fill="#F7F9FB" stroke="#D8DEE6"/>
  <rect x="26" y="92" width="4" height="86" rx="2" fill="#C77D3A"/>
  <text class="h" x="46" y="118">PEER · SEC-03</text>
  <text class="l" x="46" y="144">Zero trust och suveränitet</text>
  <text class="s" x="46" y="164">tillitsbidrag: integritet · i federationen sedan 2024</text>
  <rect x="674" y="112" width="152" height="30" rx="15" fill="#F2F6F3" stroke="#2F6B4F"/>
  <circle cx="694" cy="127" r="5" fill="#2F6B4F"/>
  <text class="s" x="708" y="131" fill="#2F6B4F">Ledig för review</text>
  <text class="k" x="826" y="162" text-anchor="end">täcker EQ och AI</text>
  <text class="h" x="26" y="212">FAGLIG GRUND</text>
  <rect x="26" y="226" width="267" height="52" rx="5" fill="#FFFFFF" stroke="#D8DEE6"/>
  <rect x="26" y="226" width="3.5" height="52" rx="2" fill="#141C2B"/>
  <text class="l" x="40" y="247">Universitetsexamen</text>
  <text class="s" x="40" y="265">IT-säkerhet och ledningsansvar · 2023</text>
  <rect x="26" y="288" width="267" height="52" rx="5" fill="#FFFFFF" stroke="#D8DEE6"/>
  <rect x="26" y="288" width="3.5" height="52" rx="2" fill="#141C2B"/>
  <text class="l" x="40" y="309">Kurs genomförd</text>
  <text class="s" x="40" y="327">SC-100</text>
  <rect x="26" y="350" width="267" height="52" rx="5" fill="#FFFFFF" stroke="#D8DEE6"/>
  <rect x="26" y="350" width="3.5" height="52" rx="2" fill="#141C2B"/>
  <text class="l" x="40" y="371">Kurs genomförd</text>
  <text class="s" x="40" y="389">SC-200</text>
  <text class="h" x="307" y="212">KAN REVIEWA</text>
  <rect x="307" y="226" width="267" height="52" rx="5" fill="#FFFFFF" stroke="#D8DEE6"/>
  <rect x="307" y="226" width="3.5" height="52" rx="2" fill="#141C2B"/>
  <text class="l" x="321" y="247">SEC ↔ EA</text>
  <text class="s" x="321" y="265">identitet in i arkitekturen</text>
  <rect x="307" y="288" width="267" height="52" rx="5" fill="#FFFFFF" stroke="#D8DEE6"/>
  <rect x="307" y="288" width="3.5" height="52" rx="2" fill="#141C2B"/>
  <text class="l" x="321" y="309">SEC ↔ HYPER</text>
  <text class="s" x="321" y="327">suveränitet i driftvalet</text>
  <rect x="307" y="350" width="267" height="52" rx="5" fill="#FFFFFF" stroke="#D8DEE6"/>
  <rect x="307" y="350" width="3.5" height="52" rx="2" fill="#141C2B"/>
  <text class="l" x="321" y="371">SEC ↔ AI</text>
  <text class="s" x="321" y="389">rättslig grund för dataunderlaget</text>
  <text class="h" x="587" y="212">JÄVSFRIHET I DETTA ÄRENDE</text>
  <rect x="587" y="226" width="267" height="52" rx="5" fill="#FFFFFF" stroke="#D8DEE6"/>
  <rect x="587" y="226" width="3.5" height="52" rx="2" fill="#2F6B4F"/>
  <text class="l" x="601" y="247">Inget kontrakt</text>
  <text class="s" x="601" y="265">med någon av de tre leverantörerna</text>
  <rect x="587" y="288" width="267" height="52" rx="5" fill="#FFFFFF" stroke="#D8DEE6"/>
  <rect x="587" y="288" width="3.5" height="52" rx="2" fill="#2F6B4F"/>
  <text class="l" x="601" y="309">Ingen roll</text>
  <text class="s" x="601" y="327">i leveransen eller dess förberedelse</text>
  <rect x="587" y="350" width="267" height="52" rx="5" fill="#FFFFFF" stroke="#D8DEE6"/>
  <rect x="587" y="350" width="3.5" height="52" rx="2" fill="#2F6B4F"/>
  <text class="l" x="601" y="371">Avstånd: 2 led</text>
  <text class="s" x="601" y="389">till närmaste gemensamma ägare</text>
  <rect x="26" y="414" width="828" height="60" rx="5" fill="#F4F6F8" stroke="#D8DEE6"/>
  <text class="h" x="42" y="438">REVIEWHISTORIK</text>
  <text class="b" x="42" y="460">14 review · senaste för 12 dagar sedan</text>
  <text class="nb" x="644" y="454" text-anchor="end" fill="#A5652C">3</text>
  <text class="b" x="652" y="454">gånger sagt nej</text>
  <text class="b" x="26" y="500">En peer som aldrig har sagt nej är inte ett review. Talet är en del av profilen, inte en notering i en mapp.</text>
  <line x1="26" y1="502" x2="854" y2="502" stroke="#D8DEE6"/>
  <text class="f" x="26" y="522">Grund, räckvidd och jävsfrihet står samlade. Annars är oberoende ett påstående.</text>
  <text class="fk" x="854" y="522" text-anchor="end">Profilen är beviset</text>
