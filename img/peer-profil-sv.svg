<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 548" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-labelledby="pprT pprD" class="ppr">
  <title id="pprT">Peer-profilen</title>
  <desc id="pprD">Vad som ska stå om en expert, innan någon kan använda deras nej till något</desc>
  <style>
    .ppr .t{font-family:Arial,sans-serif;font-size:19px;font-weight:700;fill:#141C2B}
    .ppr .u{font-family:Arial,sans-serif;font-size:12.5px;fill:#6B7685}
