  <text class="l" x="42" y="367" fill="#6B7685">EA reviewt niet</text>
  <text class="s" x="42" y="385">het spoor schreef het voorstel</text>
  <text class="b" x="26" y="428">De beslissing zit in een koppeling, niet in een domein. Daarom komt de review van de andere uiteinden ervan.</text>
  <line x1="26" y1="444" x2="854" y2="444" stroke="#D8DEE6"/>
  <text class="f" x="26" y="464">Twee keer nee was mogelijk. Dat het niet kwam, maakt het ja de moeite waard.</text>
  <text class="fk" x="854" y="464" text-anchor="end">Geen enkele rechter</text>
