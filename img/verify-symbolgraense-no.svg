<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 522" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-labelledby="vfsT vfsD" class="vfs">
  <title id="vfsT">Dekodingsgrensen</title>
  <desc id="vfsD">Om påstanden kan kontrolleres av en maskin, eller bare av et menneske</desc>
  <style>
    .vfs .t{font-family:"Archivo",Arial,sans-serif;font-size:19px;font-weight:700;fill:#141C2B}
    .vfs .u{font-family:"Archivo",Arial,sans-serif;font-size:12.5px;fill:#6B7685}
    .vfs .h{font-family:"Archivo",Arial,sans-serif;font-size:12px;font-weight:700;fill:#6B7685;letter-spacing:.07em}
    .vfs .l{font-family:"Archivo",Arial,sans-serif;font-size:13.5px;font-weight:700;fill:#141C2B}
    .vfs .b{font-family:"Archivo",Arial,sans-serif;font-size:12.5px;fill:#46505E}
    .vfs .s{font-family:"Archivo",Arial,sans-serif;font-size:11.5px;fill:#6B7685}
    .vfs .m{font-family:ui-monospace,Menlo,monospace;font-size:12px;fill:#141C2B}
    .vfs .mk{font-family:ui-monospace,Menlo,monospace;font-size:11px;fill:#6B7685}
    .vfs .f{font-family:"Archivo",Arial,sans-serif;font-size:11.5px;fill:#6B7685}
    .vfs .fk{font-family:"Archivo",Arial,sans-serif;font-size:11.5px;font-weight:700;fill:#A5652C}
  </style>
  <rect x="0" y="0" width="880" height="522" rx="6" fill="#FFFFFF" stroke="#D8DEE6"/>
  <text class="t" x="26" y="38">3 · Dekodingsgrensen</text>
  <text class="u" x="26" y="59">Om påstanden kan kontrolleres av en maskin, eller bare av et menneske</text>
  <line x1="26" y1="74" x2="854" y2="74" stroke="#D8DEE6"/>

  <text class="h" x="26" y="106">UTEN ET BEGREPSSETT HOS DERE</text>
  <rect x="26" y="118" width="400" height="196" rx="6" fill="#FBF6F5" stroke="#B0413E" stroke-width="1.4"/>
  <text class="l" x="44" y="144">Agenten svarer i fri tekst</text>
  <rect x="44" y="158" width="364" height="44" rx="4" fill="#FFFFFF" stroke="#E2D4D3"/>
  <text class="m" x="56" y="176">"Saken kan behandles etter</text>
  <text class="m" x="56" y="193">gjeldende regler, jf. vedlegg 3."</text>
  <text class="b" x="44" y="228">Setningen er velformet. Om den er riktig, kan bare</text>
  <text class="b" x="44" y="246">avgjøres av noen som kjenner saken.</text>
  <rect x="44" y="260" width="364" height="38" rx="4" fill="#FFFFFF" stroke="#E2D4D3"/>
  <text class="l" x="56" y="277" fill="#B0413E">Ett menneske pr. beslutning</text>
  <text class="s" x="56" y="292">Byrden vokser i takt med bruken. Det finnes ingen utgang.</text>

  <text class="h" x="454" y="106">MED ET BEGREPSSETT HOS DERE</text>
  <rect x="454" y="118" width="400" height="196" rx="6" fill="#F4F8F5" stroke="#2F6B4F" stroke-width="1.4"/>
  <text class="l" x="472" y="144">Agenten svarer i deres begreper</text>
  <rect x="472" y="158" width="364" height="44" rx="4" fill="#FFFFFF" stroke="#CFE0D5"/>
  <text class="m" x="484" y="176">sakstype: SAK-04 · hjemmel: §12</text>
  <text class="mk" x="484" y="193">begrepssett v2-1-0 · bevisrang 2</text>
  <text class="b" x="472" y="228">Svaret er et symbol som finnes i deres eget</text>
  <text class="b" x="472" y="246">begrepssett. Finnes det ikke, avvises svaret.</text>
  <rect x="472" y="260" width="364" height="38" rx="4" fill="#FFFFFF" stroke="#CFE0D5"/>
  <text class="l" x="484" y="277" fill="#2F6B4F">Rutinen passerer, unntaket går videre</text>
  <text class="s" x="484" y="292">Mennesket ser bare det som faller utenfor - ikke alt.</text>

  <rect x="26" y="330" width="828" height="76" rx="5" fill="#F7F9FB" stroke="#D8DEE6"/>
  <text class="h" x="42" y="352">HVOR BEGREPSSETTET KOMMER FRA</text>
  <text class="b" x="42" y="374">Har dere det selv, bruker vi deres. Ellers leverer vi et arbeidssett med avtalt utløpsdato, som dere overtar underveis.</text>
  <text class="b" x="42" y="394">Strukturen er vår - hvordan et begrep defineres, versjoneres og får en eier. Innholdet er deres og blir aldri noe annet.</text>

  <text class="b" x="26" y="428">Det er her Verify henger sammen med Custody: begrepssettet er versjonert og signert,</text>
  <text class="b" x="26" y="446">og hver avgjørelse bærer hvilken versjon den ble truffet under.</text>

  <line x1="26" y1="470" x2="854" y2="470" stroke="#D8DEE6"/>
  <text class="f" x="26" y="490">Uten et begrepssett kan verifikasjonen bare kontrollere formen. Ikke om svaret er riktig.</text>
  <text class="fk" x="854" y="490" text-anchor="end">Det er her byrden knekker</text>
</svg>
