  <text class="s" x="42" y="385">der Strang schrieb den Vorschlag</text>
  <text class="b" x="26" y="428">Die Entscheidung liegt in einer Kopplung, nicht in einer Domäne. Deshalb kommt die Prüfung von den anderen Enden davon.</text>
  <line x1="26" y1="444" x2="854" y2="444" stroke="#D8DEE6"/>
  <text class="f" x="26" y="464">Zwei Nein waren möglich. Dass sie ausblieben, macht das Ja wertvoll.</text>
  <text class="fk" x="854" y="464" text-anchor="end">Kein einzelner Richter</text>
