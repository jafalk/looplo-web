<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 522" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-labelledby="vfsT vfsD" class="vfs">
  <title id="vfsT">Afkodningsgrænsen</title>
  <desc id="vfsD">Om påstanden kan kontrolleres af en maskine eller kun af et menneske</desc>
  <style>
    .vfs .t{font-family:"Archivo",Arial,sans-serif;font-size:19px;font-weight:700;fill:#141C2B}
    .vfs .u{font-family:"Archivo",Arial,sans-serif;font-size:12.5px;fill:#6B7685}
    .vfs .h{font-family:"Archivo",Arial,sans-serif;font-size:12px;font-weight:700;fill:#6B7685;letter-spacing:.07em}
    .vfs .l{font-family:"Archivo",Arial,sans-serif;font-size:13.5px;font-weight:700;fill:#141C2B}
    .vfs .b{font-family:"Archivo",Arial,sans-serif;font-size:12.5px;fill:#46505E}
    .vfs .s{font-family:"Archivo",Arial,sans-serif;font-size:11.5px;fill:#6B7685}
    .vfs .m{font-family:ui-monospace,Menlo,monospace;font-size:12px;fill:#141C2B}
    .vfs .mk{font-family:ui-monospace,Menlo,monospace;font-size:11px;fill:#6B7685}
    .vfs .f{font-family:"Archivo",Arial,sans-serif;font-size:11.5px;fill:#6B7685}
    .vfs .fk{font-family:"Archivo",Arial,sans-serif;font-size:11.5px;font-weight:700;fill:#A5652C}
  </style>
  <rect x="0" y="0" width="880" height="522" rx="6" fill="#FFFFFF" stroke="#D8DEE6"/>
  <text class="t" x="26" y="38">3 · Afkodningsgrænsen</text>
  <text class="u" x="26" y="59">Om påstanden kan kontrolleres af en maskine, eller kun af et menneske</text>
  <line x1="26" y1="74" x2="854" y2="74" stroke="#D8DEE6"/>

  <text class="h" x="26" y="106">UDEN ET BEGREBSSÆT HOS JER</text>
  <rect x="26" y="118" width="400" height="196" rx="6" fill="#FBF6F5" stroke="#B0413E" stroke-width="1.4"/>
  <text class="l" x="44" y="144">Agenten svarer i fri tekst</text>
  <rect x="44" y="158" width="364" height="44" rx="4" fill="#FFFFFF" stroke="#E2D4D3"/>
  <text class="m" x="56" y="176">"Sagen kan behandles efter</text>
  <text class="m" x="56" y="193">gældende regler, jf. bilag 3."</text>
  <text class="b" x="44" y="228">Sætningen er velformet. Om den er rigtig, kan kun</text>
  <text class="b" x="44" y="246">afgøres af nogen der kender sagen.</text>
  <rect x="44" y="260" width="364" height="38" rx="4" fill="#FFFFFF" stroke="#E2D4D3"/>
  <text class="l" x="56" y="277" fill="#B0413E">Ét menneske pr. beslutning</text>
  <text class="s" x="56" y="292">Byrden vokser i takt med brugen. Der er ingen udgang.</text>

  <text class="h" x="454" y="106">MED ET BEGREBSSÆT HOS JER</text>
  <rect x="454" y="118" width="400" height="196" rx="6" fill="#F4F8F5" stroke="#2F6B4F" stroke-width="1.4"/>
  <text class="l" x="472" y="144">Agenten svarer i jeres begreber</text>
  <rect x="472" y="158" width="364" height="44" rx="4" fill="#FFFFFF" stroke="#CFE0D5"/>
  <text class="m" x="484" y="176">sagstype: SAG-04 · hjemmel: §12</text>
  <text class="mk" x="484" y="193">begrebssæt v2-1-0 · bevisrang 2</text>
  <text class="b" x="472" y="228">Svaret er et symbol der findes i jeres eget</text>
  <text class="b" x="472" y="246">begrebssæt. Findes det ikke, afvises svaret.</text>
  <rect x="472" y="260" width="364" height="38" rx="4" fill="#FFFFFF" stroke="#CFE0D5"/>
  <text class="l" x="484" y="277" fill="#2F6B4F">Rutinen passerer, undtagelsen går videre</text>
  <text class="s" x="484" y="292">Mennesket ser det få der falder udenfor - ikke alt.</text>

  <rect x="26" y="330" width="828" height="76" rx="5" fill="#F7F9FB" stroke="#D8DEE6"/>
  <text class="h" x="42" y="352">HVOR BEGREBSSÆTTET KOMMER FRA</text>
  <text class="b" x="42" y="374">Har I det selv, bruger vi jeres. Har I det ikke, leverer vi et arbejdssæt med en aftalt udløbsdato, som I overtager undervejs.</text>
  <text class="b" x="42" y="394">Strukturen er vores - hvordan et begreb defineres, versioneres og får en ejer. Indholdet er jeres og bliver aldrig andet.</text>

  <text class="b" x="26" y="428">Det er her Verify hænger sammen med Custody: begrebssættet er versioneret og signeret,</text>
  <text class="b" x="26" y="446">og hver afgørelse bærer hvilken version den blev truffet under.</text>

  <line x1="26" y1="470" x2="854" y2="470" stroke="#D8DEE6"/>
  <text class="f" x="26" y="490">Uden et begrebssæt kan verifikationen kun kontrollere formen. Ikke om svaret er rigtigt.</text>
  <text class="fk" x="854" y="490" text-anchor="end">Det er her byrden knækker</text>
</svg>
