<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 486" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-labelledby="vfaT vfaD" class="vfa">
  <title id="vfaT">Attestationen</title>
  <desc id="vfaD">Én påstand, to målinger, ét tal ingen af parterne selv kunne bære</desc>
  <style>
    .vfa .t{font-family:Arial,sans-serif;font-size:19px;font-weight:700;fill:#141C2B}
    .vfa .u{font-family:Arial,sans-serif;font-size:12.5px;fill:#6B7685}
    .vfa .h{font-family:Arial,sans-serif;font-size:12px;font-weight:700;fill:#6B7685;letter-spacing:.07em}
    .vfa .l{font-family:Arial,sans-serif;font-size:13.5px;font-weight:700;fill:#141C2B}
    .vfa .b{font-family:Arial,sans-serif;font-size:12.5px;fill:#46505E}
    .vfa .s{font-family:Arial,sans-serif;font-size:11.5px;fill:#6B7685}
    .vfa .n{font-family:ui-monospace,Menlo,monospace;font-size:13px;fill:#141C2B}
    .vfa .nb{font-family:ui-monospace,Menlo,monospace;font-size:16px;font-weight:700;fill:#141C2B}
    .vfa .k{font-family:ui-monospace,Menlo,monospace;font-size:11px;fill:#6B7685}
    .vfa .f{font-family:Arial,sans-serif;font-size:11.5px;fill:#6B7685}
    .vfa .fk{font-family:Arial,sans-serif;font-size:11.5px;font-weight:700;fill:#A5652C}
  </style>
  <rect x="0" y="0" width="880" height="486" rx="6" fill="#FFFFFF" stroke="#D8DEE6"/>
  <text class="t" x="26" y="38">1 · Attestationen</text>
  <text class="u" x="26" y="59">Én påstand, to målinger, ét tal ingen af parterne selv kunne bære</text>
  <line x1="26" y1="74" x2="854" y2="74" stroke="#D8DEE6"/>
  <rect x="26" y="92" width="828" height="58" rx="5" fill="#F7F9FB" stroke="#D8DEE6"/>
  <text class="h" x="42" y="114">PÅSTANDEN</text>
  <text class="l" x="42" y="136">Leverancen holder data inden for EU i hele kæden, jf. krav 4.2</text>
  <rect x="26" y="170" width="828" height="52" rx="5" fill="#FFFFFF" stroke="#D8DEE6"/>
  <rect x="26" y="170" width="4" height="52" rx="2" fill="#2F6B4F"/>
  <text class="l" x="46" y="192">Sælgers måling</text>
  <text class="s" x="46" y="210">egen telemetri · målt ved udgang fra platformen</text>
  <text class="nb" x="838" y="202" text-anchor="end">99,4 %</text>
  <rect x="26" y="232" width="828" height="52" rx="5" fill="#FFFFFF" stroke="#D8DEE6"/>
  <rect x="26" y="232" width="4" height="52" rx="2" fill="#C77D3A"/>
  <text class="l" x="46" y="254">Købers måling</text>
  <text class="s" x="46" y="272">egen logopsamling · målt ved indgang hos brugeren</text>
  <text class="nb" x="838" y="264" text-anchor="end">96,1 %</text>
  <text class="k" x="838" y="286" text-anchor="end">3,3 point fra hinanden · begge tal er rigtige</text>
  <rect x="26" y="296" width="828" height="86" rx="5" fill="#FDF8F3" stroke="#C77D3A" stroke-dasharray="5 4"/>
  <text class="h" x="42" y="318" fill="#A5652C">ATTESTERET AF LOOPLO VERIFY</text>
  <text class="l" x="42" y="342">97,8 % i intervallet 96,1 - 99,4</text>
  <text class="s" x="42" y="366">Metode fastlagt før måling · samme målepunkt · afvigelsen forklaret, ikke udjævnet</text>
  <text class="k" x="612" y="320">96,1</text>
  <text class="k" x="822" y="320" text-anchor="end">99,4</text>
  <line x1="612" y1="340" x2="822" y2="340" stroke="#D8DEE6" stroke-width="6" stroke-linecap="round"/>
  <line x1="612" y1="340" x2="822" y2="340" stroke="#C77D3A" stroke-width="6" stroke-linecap="round"/>
  <circle cx="727" cy="340" r="6" fill="#141C2B"/>
  <text class="k" x="727" y="362" text-anchor="middle">97,8</text>
  <text class="h" x="26" y="414">BEVIS</text>
  <text class="k" x="130" y="414">sha256 4f2a…c917 · 17.04.2026 09:14 CET · begge parter har set samme grundlag</text>
  <line x1="26" y1="440" x2="854" y2="440" stroke="#D8DEE6"/>
  <text class="f" x="26" y="460">Honorar per attestation. Aldrig andel af udfaldet.</text>
  <text class="fk" x="854" y="460" text-anchor="end">Neutraliteten er hele værdien</text>
</svg>