<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 522" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-labelledby="vfsT vfsD" class="vfs">
  <title id="vfsT">Avkodningsgränsen</title>
  <desc id="vfsD">Om påståendet kan kontrolleras av en maskin, eller bara av en människa</desc>
  <style>
    .vfs .t{font-family:"Archivo",Arial,sans-serif;font-size:19px;font-weight:700;fill:#141C2B}
    .vfs .u{font-family:"Archivo",Arial,sans-serif;font-size:12.5px;fill:#6B7685}
    .vfs .h{font-family:"Archivo",Arial,sans-serif;font-size:12px;font-weight:700;fill:#6B7685;letter-spacing:.07em}
    .vfs .l{font-family:"Archivo",Arial,sans-serif;font-size:13.5px;font-weight:700;fill:#141C2B}
    .vfs .b{font-family:"Archivo",Arial,sans-serif;font-size:12.5px;fill:#46505E}
    .vfs .s{font-family:"Archivo",Arial,sans-serif;font-size:11.5px;fill:#6B7685}
    .vfs .m{font-family:ui-monospace,Menlo,monospace;font-size:12px;fill:#141C2B}
    .vfs .mk{font-family:ui-monospace,Menlo,monospace;font-size:11px;fill:#6B7685}
    .vfs .f{font-family:"Archivo",Arial,sans-serif;font-size:11.5px;fill:#6B7685}
    .vfs .fk{font-family:"Archivo",Arial,sans-serif;font-size:11.5px;font-weight:700;fill:#A5652C}
  </style>
  <rect x="0" y="0" width="880" height="522" rx="6" fill="#FFFFFF" stroke="#D8DEE6"/>
  <text class="t" x="26" y="38">3 · Avkodningsgränsen</text>
  <text class="u" x="26" y="59">Om påståendet kan kontrolleras av en maskin, eller bara av en människa</text>
  <line x1="26" y1="74" x2="854" y2="74" stroke="#D8DEE6"/>

  <text class="h" x="26" y="106">UTAN EN BEGREPPSUPPSÄTTNING HOS ER</text>
  <rect x="26" y="118" width="400" height="196" rx="6" fill="#FBF6F5" stroke="#B0413E" stroke-width="1.4"/>
  <text class="l" x="44" y="144">Agenten svarar i fri text</text>
  <rect x="44" y="158" width="364" height="44" rx="4" fill="#FFFFFF" stroke="#E2D4D3"/>
  <text class="m" x="56" y="176">"Ärendet kan handläggas enligt</text>
  <text class="m" x="56" y="193">gällande regler, jfr bilaga 3."</text>
  <text class="b" x="44" y="228">Meningen är välformad. Om den är riktig kan bara</text>
  <text class="b" x="44" y="246">avgöras av någon som känner ärendet.</text>
  <rect x="44" y="260" width="364" height="38" rx="4" fill="#FFFFFF" stroke="#E2D4D3"/>
  <text class="l" x="56" y="277" fill="#B0413E">En människa per beslut</text>
  <text class="s" x="56" y="292">Bördan växer i takt med användningen. Det finns ingen utgång.</text>

  <text class="h" x="454" y="106">MED EN BEGREPPSUPPSÄTTNING HOS ER</text>
  <rect x="454" y="118" width="400" height="196" rx="6" fill="#F4F8F5" stroke="#2F6B4F" stroke-width="1.4"/>
  <text class="l" x="472" y="144">Agenten svarar i era begrepp</text>
  <rect x="472" y="158" width="364" height="44" rx="4" fill="#FFFFFF" stroke="#CFE0D5"/>
  <text class="m" x="484" y="176">ärendetyp: ÄRENDE-04 · stöd: §12</text>
  <text class="mk" x="484" y="193">begreppsuppsättning v2-1-0 · bevisrang 2</text>
  <text class="b" x="472" y="228">Svaret är en symbol som finns i er egen</text>
  <text class="b" x="472" y="246">uppsättning. Finns den inte, avvisas svaret.</text>
  <rect x="472" y="260" width="364" height="38" rx="4" fill="#FFFFFF" stroke="#CFE0D5"/>
  <text class="l" x="484" y="277" fill="#2F6B4F">Rutinen passerar, undantaget går vidare</text>
  <text class="s" x="484" y="292">Människan ser bara det som faller utanför - inte allt.</text>

  <rect x="26" y="330" width="828" height="76" rx="5" fill="#F7F9FB" stroke="#D8DEE6"/>
  <text class="h" x="42" y="352">VAR BEGREPPSUPPSÄTTNINGEN KOMMER IFRÅN</text>
  <text class="b" x="42" y="374">Har ni en, använder vi er. Annars levererar vi en arbetsuppsättning med utgångsdatum som ni tar över efter hand.</text>
  <text class="b" x="42" y="394">Strukturen är vår - hur ett begrepp definieras, versioneras och får en ägare. Innehållet är ert och blir aldrig något annat.</text>

  <text class="b" x="26" y="428">Det är här Verify hänger ihop med Custody: uppsättningen är versionerad och signerad,</text>
  <text class="b" x="26" y="446">och varje avgörande bär vilken version det fattades under.</text>

  <line x1="26" y1="470" x2="854" y2="470" stroke="#D8DEE6"/>
  <text class="f" x="26" y="490">Utan begreppsuppsättning kan verifieringen bara kontrollera formen. Inte om svaret är riktigt.</text>
  <text class="fk" x="854" y="490" text-anchor="end">Det är här bördan brister</text>
</svg>
