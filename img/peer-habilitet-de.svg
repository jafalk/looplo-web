  <line x1="26" y1="410" x2="854" y2="410" stroke="#D8DEE6"/>
  <text class="b" x="26" y="432">Auch Looplos eigener EA-Strang ist hier befangen. Das ist der Punkt: Unbefangenheit folgt der Rolle im Fall, nicht dem Namen des Hauses.</text>
  <line x1="26" y1="440" x2="854" y2="440" stroke="#D8DEE6"/>
  <text class="f" x="26" y="460">Abstand: Anzahl der Glieder bis zum nächsten gemeinsamen Eigentümer, Vertrag oder zur Führungslinie.</text>
  <text class="fk" x="854" y="460" text-anchor="end">Vier befangen · zwei unbefangen</text>
