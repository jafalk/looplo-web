<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 470" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-labelledby="vfn2T vfn2D" class="vfn2">
  <title id="vfn2T">Vad ska kunna bevisas om en agenthandling</title>
  <desc id="vfn2D">Fem led i kedjan, och det enda som inte följer med ut ur huset</desc>
  <style>
    .vfn2 .t{font-family:Arial,sans-serif;font-size:19px;font-weight:700;fill:#141C2B}
    .vfn2 .u{font-family:Arial,sans-serif;font-size:12.5px;fill:#6B7685}
    .vfn2 .h{font-family:Arial,sans-serif;font-size:12px;font-weight:700;fill:#6B7685;letter-spacing:.07em}
    .vfn2 .l{font-family:Arial,sans-serif;font-size:13.5px;font-weight:700;fill:#141C2B}
    .vfn2 .b{font-family:Arial,sans-serif;font-size:12.5px;fill:#46505E}
    .vfn2 .s{font-family:Arial,sans-serif;font-size:11.5px;fill:#6B7685}
    .vfn2 .n{font-family:ui-monospace,Menlo,monospace;font-size:13px;fill:#141C2B}
    .vfn2 .nb{font-family:ui-monospace,Menlo,monospace;font-size:16px;font-weight:700;fill:#141C2B}
    .vfn2 .k{font-family:ui-monospace,Menlo,monospace;font-size:11px;fill:#6B7685}
    .vfn2 .f{font-family:Arial,sans-serif;font-size:11.5px;fill:#6B7685}
    .vfn2 .fk{font-family:Arial,sans-serif;font-size:11.5px;font-weight:700;fill:#A5652C}
  </style>
  <rect x="0" y="0" width="880" height="470" rx="6" fill="#FFFFFF" stroke="#D8DEE6"/>
  <text class="t" x="26" y="38">2 · Vad ska kunna bevisas om en agenthandling</text>
  <text class="u" x="26" y="59">Fem led i kedjan, och det enda som inte följer med ut ur huset</text>
  <line x1="26" y1="74" x2="854" y2="74" stroke="#D8DEE6"/>
  <rect x="26" y="130" width="150" height="104" rx="6" fill="#FFFFFF" stroke="#D8DEE6"/>
  <rect x="26" y="130" width="150" height="3.5" rx="2" fill="#141C2B"/>
  <text class="k" x="40" y="156">01</text>
  <text class="l" x="40" y="180">Mandatet</text>
  <text class="s" x="40" y="200">vem gav tillåtelse,</text>
  <text class="s" x="40" y="216">och till vad</text>
  <line x1="178" y1="182" x2="190" y2="182" stroke="#8C97A6" stroke-width="1.8"/>
  <polygon points="196,182 188,178 188,186" fill="#8C97A6"/>
  <rect x="196" y="130" width="150" height="104" rx="6" fill="#FFFFFF" stroke="#D8DEE6"/>
  <rect x="196" y="130" width="150" height="3.5" rx="2" fill="#141C2B"/>
  <text class="k" x="210" y="156">02</text>
  <text class="l" x="210" y="180">Modellen</text>
  <text class="s" x="210" y="200">vilken modell,</text>
  <text class="s" x="210" y="216">vilken version</text>
  <line x1="348" y1="182" x2="360" y2="182" stroke="#8C97A6" stroke-width="1.8"/>
  <polygon points="366,182 358,178 358,186" fill="#8C97A6"/>
  <rect x="366" y="130" width="150" height="104" rx="6" fill="#FFFFFF" stroke="#D8DEE6"/>
  <rect x="366" y="130" width="150" height="3.5" rx="2" fill="#141C2B"/>
  <text class="k" x="380" y="156">03</text>
  <text class="l" x="380" y="180">Underlaget</text>
  <text class="s" x="380" y="200">vilka data,</text>
  <text class="s" x="380" y="216">vilken rättslig grund</text>
  <line x1="518" y1="182" x2="530" y2="182" stroke="#8C97A6" stroke-width="1.8"/>
  <polygon points="536,182 528,178 528,186" fill="#8C97A6"/>
  <rect x="536" y="130" width="150" height="104" rx="6" fill="#FFFFFF" stroke="#D8DEE6"/>
  <rect x="536" y="130" width="150" height="3.5" rx="2" fill="#141C2B"/>
  <text class="k" x="550" y="156">04</text>
  <text class="l" x="550" y="180">Handlingen</text>
  <text class="s" x="550" y="200">vad den</text>
  <text class="s" x="550" y="216">faktiskt gjorde</text>
  <line x1="696" y1="122" x2="696" y2="242" stroke="#B0413E" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="706" y="130" width="150" height="104" rx="6" fill="#FDF8F3" stroke="#C77D3A"/>
  <rect x="706" y="130" width="150" height="3.5" rx="2" fill="#C77D3A"/>
  <text class="k" x="720" y="156">05</text>
  <text class="l" x="720" y="180">Påståendet</text>
  <text class="s" x="720" y="200">vad som</text>
  <text class="s" x="720" y="216">sades utåt</text>
  <rect x="26" y="252" width="660" height="30" rx="4" fill="#141C2B" fill-opacity=".045"/>
  <text class="k" x="356" y="272" text-anchor="middle">kan dokumenteras inne i huset</text>
  <rect x="706" y="252" width="150" height="30" rx="4" fill="#C77D3A" fill-opacity=".10"/>
  <text class="k" x="781" y="272" text-anchor="middle" fill="#A5652C">är det motparten ser</text>
  <rect x="26" y="304" width="828" height="66" rx="5" fill="#F7F9FB" stroke="#D8DEE6"/>
  <text class="h" x="42" y="326" fill="#B0413E">HÄR BRISTER KEDJAN</text>
  <text class="b" x="42" y="350">Allt som kan dokumenteras stannar inne i huset. Det som går ut är ett påstående utan sin grund.</text>
  <text class="b" x="26" y="400">Motparten kan inte se de fyra första leden. Och den som kan har intresse i utfallet.</text>
  <line x1="26" y1="424" x2="854" y2="424" stroke="#D8DEE6"/>
  <text class="f" x="26" y="444">Kedjan är bara värd så mycket som det led motparten faktiskt kan pröva.</text>
  <text class="fk" x="854" y="444" text-anchor="end">Beviset följer inte med ut</text>
</svg>