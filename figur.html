<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=6,user-scalable=yes">
<title>Figur · Looplo</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#141C2B;--copper:#C77D3A;--paper:#F4F6F8;--white:#fff;--line:#D8DEE6;--grey2:#6B7685;
  --sans:"Archivo",Arial,Helvetica,sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);font-family:var(--sans);color:var(--ink);
  display:flex;flex-direction:column}
.bar{flex:0 0 auto;background:var(--ink);color:#fff;display:flex;align-items:center;
  justify-content:space-between;gap:14px;padding:11px 16px}
.tilbage{display:inline-flex;align-items:center;gap:9px;background:var(--white);color:var(--ink);
  border:0;border-radius:3px;font-family:var(--sans);font-size:14px;font-weight:600;
  padding:9px 15px;cursor:pointer;text-decoration:none}
.tilbage:hover{background:#EDF1F5}
.tilbage svg{width:15px;height:15px}
.titel{font-size:13px;font-weight:600;color:#C3CCD8;text-align:right;line-height:1.35}
.scene{flex:1 1 auto;display:flex;align-items:center;justify-content:center;
  padding:18px;overflow:auto;-webkit-overflow-scrolling:touch}
.scene img{display:block;max-width:100%;height:auto;background:var(--white);
  border:1px solid var(--line);border-radius:4px}
.hint{flex:0 0 auto;text-align:center;font-size:12px;color:var(--grey2);padding:0 16px 14px}
.fejl{max-width:38ch;margin:auto;text-align:center;color:var(--grey2);font-size:14px;line-height:1.6}
@media (max-width:600px){ .titel{display:none} .scene{padding:12px} }
</style>
</head>
<body>

<div class="bar">
  <a class="tilbage" id="tilbage" href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    <span id="tilbagetekst">Tilbage</span>
  </a>
  <span class="titel" id="titel"></span>
</div>

<div class="scene" id="scene"></div>
<p class="hint" id="hint"></p>

<script>
/* Navnekonvention: f=<figur>-<sprog>. Filen er img/<f>.svg, sproget er endelsen,
   og returmaalet foelger af sproget. Ingen tabel over enkeltfigurer at holde ved lige. */
(function(){
  var SIDE = {da:"index.html", no:"no.html", sv:"sv.html",
              nl:"nl.html", de:"de.html", en:"en.html"};

  var UI = {
    da:{tilbage:"Tilbage", hint:"Knib eller dobbelttryk for at zoome",
        fejl:"Figuren blev ikke fundet. G\u00e5 tilbage og pr\u00f8v igen."},
    no:{tilbage:"Tilbake", hint:"Knip eller dobbelttrykk for \u00e5 zoome",
        fejl:"Figuren ble ikke funnet. G\u00e5 tilbake og pr\u00f8v igjen."},
    sv:{tilbage:"Tillbaka", hint:"Nyp eller dubbeltryck f\u00f6r att zooma",
        fejl:"Figuren hittades inte. G\u00e5 tillbaka och f\u00f6rs\u00f6k igen."},
    nl:{tilbage:"Terug", hint:"Knijp of dubbeltik om te zoomen",
        fejl:"De figuur is niet gevonden. Ga terug en probeer opnieuw."},
    de:{tilbage:"Zur\u00fcck", hint:"Zwei Finger oder Doppeltippen zum Zoomen",
        fejl:"Die Abbildung wurde nicht gefunden. Gehen Sie zur\u00fcck und versuchen Sie es erneut."},
    en:{tilbage:"Back", hint:"Pinch or double tap to zoom",
        fejl:"The figure was not found. Go back and try again."}
  };

  var TITEL = {
    firelag:{
      da:"Fire lag uden f\u00e6lles n\u00f8gle",
      no:"Fire lag uten felles n\u00f8kkel",
      sv:"Fyra lager utan gemensam nyckel",
      nl:"Vier lagen zonder gemeenschappelijke sleutel",
      de:"Vier Schichten ohne gemeinsamen Schl\u00fcssel",
      en:"Four layers without a common key"},
    livscyklus:{
      da:"Livscyklus krydset med aftryk",
      no:"Livssyklus krysset med avtrykk",
      sv:"Livscykel korsad med avtryck",
      nl:"Levenscyclus gekruist met voetafdruk",
      de:"Lebenszyklus gekreuzt mit Fu\u00dfabdruck",
      en:"Lifecycle crossed with footprint"},
    optimum:{
      da:"De to regnskaber topper ikke samme sted",
      no:"De to regnskapene topper seg ikke samme sted",
      sv:"De tv\u00e5 redovisningarna toppar inte p\u00e5 samma st\u00e4lle",
      nl:"De twee overzichten pieken niet op dezelfde plek",
      de:"Die beiden Rechnungen erreichen ihr Optimum nicht an derselben Stelle",
      en:"The two accounts do not peak in the same place"}
  };

  var q     = new URLSearchParams(location.search);
  var navn  = (q.get("f") || "").replace(/[^a-z0-9-]/gi, "");
  var til   = (q.get("til") || "").replace(/[^a-z0-9-]/gi, "");
  var delt  = navn.lastIndexOf("-");
  var figur = delt > 0 ? navn.slice(0, delt) : "";
  var sprog = delt > 0 ? navn.slice(delt + 1) : "";

  var ui    = UI[sprog] || UI.da;
  var scene = document.getElementById("scene");
  document.documentElement.setAttribute("lang", SIDE[sprog] ? sprog : "da");
  document.getElementById("tilbagetekst").textContent = ui.tilbage;

  if(!SIDE[sprog] || !TITEL[figur]){
    scene.innerHTML = '<p class="fejl">' + ui.fejl + '</p>';
    return;
  }

  var titel = TITEL[figur][sprog];
  document.title = titel + " \u00b7 Looplo";
  document.getElementById("titel").textContent = titel;
  document.getElementById("hint").textContent = ui.hint;

  /* Returmaalet: samme sprogfil, groent-ruten, og ?til= saa siden lander paa figuren. */
  var retur = SIDE[sprog] + (til ? "?til=" + encodeURIComponent(til) : "") + "#groent";
  document.getElementById("tilbage").setAttribute("href", retur);

  var img = new Image();
  img.src = "img/" + navn + ".svg";
  img.alt = titel;
  img.onerror = function(){ scene.innerHTML = '<p class="fejl">' + ui.fejl + '</p>'; };
  scene.appendChild(img);
})();
</script>
</body>
</html>
